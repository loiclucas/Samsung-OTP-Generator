  <text x="412" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">The backend detects the key format and routes to the configured algorithm.</text>

  <text x="412" y="327" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#424143">Android version:</text>
