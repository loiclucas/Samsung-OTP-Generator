  <rect x="380" y="130" width="520" height="560" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="380" y="130" width="520" height="560" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="412" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#424143">Input code:</text>
