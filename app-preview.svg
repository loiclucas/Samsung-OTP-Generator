  <text x="428" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#424143">Auto detect</text>
  <path d="M842 363 l8 8 l8 -8" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

